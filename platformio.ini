; PlatformIO 프로젝트 설정 파일
; 시각장애인용 음성유도기 ESP32-CAM 펌웨어
[env:esp32cam]
platform = espressif32
board = esp32cam
framework = arduino

; 보드 Flash 설정 (AI-Thinker ESP32-CAM)
board_build.partitions = huge_app.csv

; PSRAM 활성화 (카메라 프레임 버퍼용)
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=0

; Upload settings via Arduino Uno UART Bridge
; 아두이노 우노를 사용하는 경우 해당 COM 포트로 변경하세요
upload_port = COM3
upload_speed = 115200
monitor_speed = 115200

; 라이브러리 의존성
lib_deps =
    ESP Async WebServer
    AsyncTCP
    ArduinoJson@>=6.21.0
    arduino-libraries/SD
